<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>自己紹介カード</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-orange-500 py-8">
        <header class="font-bold text-2xl text-center">将棋団体戦</header>
            <h1 class="text-center font-bold text-xl">チームメンバー</h1>
        <main class="max-w-4xl mx-auto">
            <div class="flex flex-col md:flex-row justify-around gap-4 p-8">
                <div class="rounded-lg shadow bg-white p-4">
                    <img src="https://www.shogi.or.jp/images/pro/307.jpg" alt="藤井聡太の写真" class="mx-auto">
                    <h2 class="text-center text-bold text-lg">藤井 聡太</h2>
                    <p class="text-center text-gray-600 mt-2">みなさんご存じ、現役最強プロ棋士</p>
                </div>
                <div class="rounded-lg shadow bg-white p-4 items-center">
                    <img src="https://www.shogi.or.jp/images/pro/175.jpg" alt="羽生善治の写真">
                    <h2 class="text-center text-bold text-lg">羽生 善治</h2>
                    <p class="text-center text-gray-600 mt-2">伝説のプロ棋士。永世七冠</p>
                </div>
                <div class="rounded-lg shadow bg-white p-4 items-center">
                    <img src="https://www.shogi.or.jp/images/pro/324.jpg" alt="伊藤匠の写真">
                    <h2 class="text-center text-bold text-lg">伊藤 匠</h2>
                    <p class="text-center text-gray-600 mt-2">藤井聡太のライバルでタイトル二冠</p>
                </div>
            </div>
        </main>
    </body>
</html>
